aid: upstage-ai

name: Upstage

image: https://cdn.prod.website-files.com/6743d5190bb2b52f38e99e37/680a25ee07a17eed6deeff74_OG.avif

description: Upstage is a Korean AI company offering the Solar LLM family and document AI (Document Parse, OCR, Information Extract, Classify)
  through Upstage Console at https://api.upstage.ai/v1. Its Solar Decide model (beta, built on Solar Mini 4) is exposed at POST /v1/systemone,
  a System One-style endpoint taking a state plus typed questions (choice, score, noul) and returning calibrated decisions; output tokens are
  not billed. API references are published as markdown under console.upstage.ai/api/ with an llms.txt index; the reference pages cite OpenAPI
  files (e.g. ./openapi/openapi-systemone.yaml) that are not publicly retrievable, so no provider-published OpenAPI was saved.

