openapi: 3.1.0
info:
  title: Upstage System One API (Solar Decide)
  version: '2026-10-12'
  description: 'GENERATED FROM DOCUMENTATION by API Evangelist on 2026-10-12: 1 operation read from the public System One
    API reference page. This is NOT the provider''s published contract. The page references "./openapi/openapi-systemone.yaml",
    but that path is not publicly served (it returns the console HTML shell), so no provider-published machine-readable contract
    could be retrieved. Solar Decide is in beta and the provider states the /v1/systemone schema may change before general
    availability. Request fields are taken from the documented example request; response fields from the documented response
    tables.'
  x-generated-from: documentation
  x-provenance: generated
  x-apievangelist-provenance: generated-from-docs
  x-authored-by: API Evangelist
  x-generated: '2026-10-12'
